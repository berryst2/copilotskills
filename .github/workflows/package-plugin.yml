name: Package Microsoft 365 plugin

on:
  workflow_dispatch:
    inputs:
      create_new_app:
        description: "Explicitly create a new dev app (first run only; creates cloud resources)"
        type: boolean
        default: false
        required: true
      publish:
        description: "Validate the ZIP with Microsoft and submit to the organization catalog for admin approval"
        type: boolean
        default: false
        required: true
      version_floor:
        description: "First migration/recovery only: highest version already uploaded to Microsoft"
        type: string
        default: ""
        required: false
  workflow_call:
    inputs:
      create_new_app:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: banking-skills-dev
  cancel-in-progress: false

jobs:
  package:
    name: Provision, package and optionally submit
    permissions:
      contents: write
      actions: read
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Verify PowerShell prerequisite
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::PowerShell 7 (pwsh) is missing from the runner service PATH. Install it during runner setup and restart the runner service; see README.md."
            exit 1
          fi
          pwsh -NoLogo -NoProfile -NonInteractive -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 or newer is required." }; $PSVersionTable.PSVersion.ToString()'
      - name: Configure WIQD executable directory
        shell: pwsh
        env:
          WIQD_BIN_DIR: ${{ vars.WIQD_BIN_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:WIQD_BIN_DIR)) {
            if ($env:WIQD_BIN_DIR -match '[\r\n]' -or
                -not [IO.Path]::IsPathFullyQualified($env:WIQD_BIN_DIR) -or
                -not (Test-Path -LiteralPath (Join-Path $env:WIQD_BIN_DIR 'wiqd') -PathType Leaf)) {
              throw 'WIQD_BIN_DIR must be an absolute directory containing the installed wiqd executable, accessible to the runner account.'
            }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:WIQD_BIN_DIR -Encoding utf8
          } elseif (-not (Get-Command wiqd -ErrorAction SilentlyContinue)) {
            throw 'WIQD is not on the job PATH. Set the dev environment variable WIQD_BIN_DIR to the directory printed by dirname "$(command -v wiqd)" in your working runner-account terminal.'
          }
      - name: Verify prepared runner and human EULA acceptance
        shell: pwsh
        run: ./scripts/check-wiqd.ps1
      - name: Install source check dependencies
        run: npm ci
      - name: Test source and ZIP checks
        run: npm test
      - name: Allocate next app version
        id: version
        uses: actions/github-script@v7
        env:
          VERSION_FLOOR: ${{ inputs.version_floor || vars.PLUGIN_VERSION_FLOOR }}
          CREATE_NEW_APP: ${{ inputs.create_new_app }}
        with:
          script: |
            const { readFileSync, writeFileSync } = require('node:fs');
            const { join } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { nextReleaseVersion, versionRecordPrefix, versionTagPrefix } = await import(
              pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts', 'release-version.mjs')).href);
            const { data: refs } = await github.rest.git.listMatchingRefs({
              ...context.repo, ref: versionTagPrefix.slice('refs/'.length)
            });
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const names = refs.map(ref => ref.ref);
            const runs = new Map();
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith(versionRecordPrefix) || artifact.expired) continue;
              const runId = artifact.workflow_run?.id;
              if (!runId) throw new Error('Version record has no owning workflow run.');
              if (!runs.has(runId)) {
                runs.set(runId, (await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: runId
                })).data);
              }
              const run = runs.get(runId);
              if (run.head_branch === 'main' &&
                  run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  ['push', 'workflow_dispatch'].includes(run.event) &&
                  ['.github/workflows/package-plugin.yml', '.github/workflows/validate-plugin.yml'].includes(run.path)) {
                names.push(artifact.name);
              }
            }
            const manifest = JSON.parse(readFileSync(
              join(process.env.GITHUB_WORKSPACE, 'banking-skills', 'appPackage', 'manifest.json'), 'utf8'));
            const version = nextReleaseVersion(manifest.version, names,
              process.env.VERSION_FLOOR, process.env.CREATE_NEW_APP === 'true');
            const tag = `${versionTagPrefix}${version}`;
            await github.rest.git.createRef({
              ...context.repo, ref: tag, sha: context.sha
            });
            const receipt = join(process.env.RUNNER_TEMP,
              `banking-skills-version-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}.json`);
            writeFileSync(receipt, JSON.stringify({
              version, runId: context.runId, attempt: process.env.GITHUB_RUN_ATTEMPT,
              commit: context.sha, environment: 'dev', tag
            }, null, 2));
            core.setOutput('version', version);
            core.setOutput('receipt', receipt);
            core.info(`Reserved app version ${version} in ${tag}; failures must not reuse it.`);
      - name: Upload version reservation receipt
        uses: actions/upload-artifact@v4
        with:
          name: banking-skills-release-version
          path: ${{ steps.version.outputs.receipt }}
          if-no-files-found: error
          retention-days: 90
      - name: Stage, validate, provision, package and optionally submit
        id: build
        shell: pwsh
        env:
          CI_ENABLED: 'true'
          M365_ACCOUNT_NAME: ${{ secrets.M365_ACCOUNT_NAME }}
          M365_ACCOUNT_PASSWORD: ${{ secrets.M365_ACCOUNT_PASSWORD }}
          PLUGIN_DEVELOPER_NAME: ${{ vars.PLUGIN_DEVELOPER_NAME }}
          PLUGIN_WEBSITE_URL: ${{ vars.PLUGIN_WEBSITE_URL }}
          PLUGIN_PRIVACY_URL: ${{ vars.PLUGIN_PRIVACY_URL }}
          PLUGIN_TERMS_URL: ${{ vars.PLUGIN_TERMS_URL }}
          TEAMS_APP_ID: ${{ vars.TEAMS_APP_ID }}
          M365_TITLE_ID: ${{ vars.M365_TITLE_ID }}
          M365_APP_ID: ${{ vars.M365_APP_ID }}
          CREATE_NEW_APP: ${{ inputs.create_new_app }}
          PUBLISH_PLUGIN: ${{ inputs.publish }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $project = Join-Path $env:RUNNER_TEMP ("banking-skills-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          ./scripts/plugin.ps1 -ProjectPath $project `
            -ReleaseVersion $env:RELEASE_VERSION `
            -Provision -CreateNewApp:($env:CREATE_NEW_APP -eq 'true') `
            -Publish:($env:PUBLISH_PLUGIN -eq 'true')
      - name: Preserve non-secret provisioning IDs
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: banking-skills-provisioning-ids
          path: dist/provisioning-ids.json
          if-no-files-found: ignore
      - name: Upload verified plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: banking-skills-plugin
          path: |
            dist/banking-skills.zip
            dist/checksum.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload organization catalog submission receipt
        if: success() && inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: banking-skills-publication
          path: dist/publication-receipt.json
          if-no-files-found: error
      - name: Clean staged project and deployment environment files
        if: always()
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP ("banking-skills-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $project) {
            Remove-Item -LiteralPath $project -Recurse -Force
          }
          $reservation = Join-Path $env:RUNNER_TEMP ("banking-skills-version-{0}-{1}.json" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $reservation -PathType Leaf) {
            Remove-Item -LiteralPath $reservation
          }
