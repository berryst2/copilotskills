name: Validate banking skill sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "legal/**"
      - "lending/**"
      - "operations/**"
      - "technology/**"
      - "banking-skills/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "legal/**"
      - "lending/**"
      - "operations/**"
      - "technology/**"
      - "banking-skills/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Check repository skill sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Install source check dependencies
        run: npm ci

      - name: Test source and ZIP checks
        run: npm test

      - name: Check all skill source folders
        run: npm run check