name: Validate Microsoft 365 plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "legal/**"
      - "lending/**"
      - "operations/**"
      - "technology/**"
      - "banking-skills/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "legal/**"
      - "lending/**"
      - "operations/**"
      - "technology/**"
      - "banking-skills/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Install Work IQ Dev Tools
        run: |
          npm install -g @microsoft/wiqd@0.24.0
          wiqd --version --skill wiqd --workflow plugin

      - name: Install source check dependencies
        run: npm ci

      - name: Test source and ZIP checks
        run: npm test

      - name: Stage skills and validate source offline
        shell: pwsh
        run: |
          ./scripts/plugin.ps1 -ProjectPath (Join-Path $env:RUNNER_TEMP 'banking-skills')